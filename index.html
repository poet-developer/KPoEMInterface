<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KPoEM – Close Reading</title>
<link rel="stylesheet" href="header.css">
</head>

<body>

<!-- ✅ FIXED HEADER -->
<header>
  <div class="logo">김소월</div>
  <nav>
    <!-- <a href="#" class="active">About</a> -->
    <a href="./frontend/close.html">Close Reading</a>
    <a href="./frontend/distant.html">Distant Reading</a>
    <a href="./frontend/co.html">Co-Reading</a>
  </nav>
</header>

<!-- ✅ PAGE TITLE -->
<h2>Close Reading</h2>
<h3>가까이 읽기</h3>

<div class="btn-group">
  <button onclick="showPoems('sowol')">김소월</button>
  <button onclick="showPoems('dongju')">윤동주</button>
  <button onclick="showPoems('isang')">이상</button>
  <button onclick="showPoems('imhwa')">임화</button>
  <button onclick="showPoems('hanyoungun')">한용운</button>
</div>

<ul id="poemList"></ul>

<script>
  const poems = {
    sowol: [
      { title: "진달래꽃", url: "frontend/close.html" },
      { title: "초혼", url: "poems/sowol_chohon.html" },
      { title: "산유화", url: "poems/sowol_sanyuhwa.html" }
    ],
    dongju: [
      { title: "서시", url: "poems/dongju_seosi.html" },
      { title: "별 헤는 밤", url: "poems/dongju_stars.html" },
      { title: "십자가", url: "poems/dongju_cross.html" }
    ],
    isang: [
      { title: "오감도", url: "poems/isang_ogamdo.html" },
      { title: "날개", url: "poems/isang_wings.html" }
    ],
    imhwa: [
      { title: "우리 오빠와 화로", url: "poems/imhwa_fireplace.html" },
      { title: "황혼", url: "poems/imhwa_twilight.html" }
    ],
    hanyoungun: [
      { title: "님의 침묵", url: "poems/han_nim.html" },
      { title: "나룻배와 행인", url: "poems/han_boat.html" }
    ]
  };

  function showPoems(author) {
    const list = document.getElementById("poemList");
    list.innerHTML = "";

    poems[author].forEach(poem => {
      const li = document.createElement("li");
      li.textContent = poem.title;
      li.onclick = () => {
        window.location.href = poem.url;
      };
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
