<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시인 작품 목록</title>

<style>
  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    padding: 40px;
    background: #f6f6f6;
  }

  h1, h2, h3 {
    text-align: center;
    margin-bottom: 30px;
  }

  .btn-group {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
  }

  button {
    padding: 10px 20px;
    border: none;
    background: #333;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
  }

  button:hover {
    background: #555;
  }

  ul {
    max-width: 500px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
  }

  li {
    background: white;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.07);
    cursor: pointer;
    transition: 0.15s;
  }

  li:hover {
    background: #efefef;
  }
</style>
</head>

<body>

<h1>KPoEM</h1>
<h2>Close Reading</h2>
<h3>가까이 읽기</h3>

<div class="btn-group">
  <button onclick="showPoems('sowol')">김소월</button>
  <button onclick="showPoems('dongju')">윤동주</button>
  <button onclick="showPoems('isang')">이상</button>
  <button onclick="showPoems('imhwa')">임화</button>
  <button onclick="showPoems('hanyoungun')">한용운</button>
</div>

<ul id="poemList"></ul>

<script>
  // ✅ 작품 데이터 + 링크
  const poems = {
    sowol: [
      { title: "진달래꽃", url: "poems/sowol_jindalrae.html" },
      { title: "초혼", url: "poems/sowol_chohon.html" },
      { title: "산유화", url: "poems/sowol_sanyuhwa.html" }
    ],
    dongju: [
      { title: "서시", url: "poems/dongju_seosi.html" },
      { title: "별 헤는 밤", url: "poems/dongju_stars.html" },
      { title: "십자가", url: "poems/dongju_cross.html" }
    ],
    isang: [
      { title: "오감도", url: "poems/isang_ogamdo.html" },
      { title: "날개", url: "poems/isang_wings.html" }
    ],
    imhwa: [
      { title: "우리 오빠와 화로", url: "poems/imhwa_fireplace.html" },
      { title: "황혼", url: "poems/imhwa_twilight.html" }
    ],
    hanyoungun: [
      { title: "님의 침묵", url: "poems/han_nim.html" },
      { title: "나룻배와 행인", url: "poems/han_boat.html" }
    ]
  };

  function showPoems(author) {
    const list = document.getElementById("poemList");
    list.innerHTML = "";

    poems[author].forEach(poem => {
      const li = document.createElement("li");
      li.textContent = poem.title;

      li.onclick = () => {
        window.location.href = poem.url;
      };

      list.appendChild(li);
    });
  }
</script>

</body>
</html>
