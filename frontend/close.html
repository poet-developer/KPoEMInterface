  <p class="poem-line" id="line_5">진달래꽃</p>
  <p class="poem-line" id="line_6">아름따다 가실 길에 뿌리오리다.</p>
    <div class="poem-stanza"></div>
  <p class="poem-line" id="line_7">가시는 걸음 걸음</p>
  <p class="poem-line" id="line_8">놓인 그 꽃을</p>
  <p class="poem-line" id="line_9">사뿐히 즈려밟고 가시옵소서.</p>
    <div class="poem-stanza"></div>
  <p class="poem-line" id="line_10">나 보기가 역겨워</p>
  <p class="poem-line" id="line_11">가실 때에는</p>
  <p class="poem-line" id="line_12">죽어도 아니 눈물 흘리오리다.</p>
</div>

<!-- ✅ MODAL -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <p id="modalTitle" class="modal-title">Line Detail</p>
      <button class="modal-close" id="modalCloseBtn" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <p id="modalLineText" class="clicked-line"></p>
      <div class = "tag_contatiner"></div>
      <p class="hint">배경을 클릭하거나 ESC를 누르면 닫힙니다.</p>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById("modalOverlay");
  const modalLineText = document.getElementById("modalLineText");
  const closeBtn = document.getElementById("modalCloseBtn");

  function openModal(text) {
    modalLineText.textContent = `"${text}"`;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden"; // 스크롤 잠금
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = ""; // 스크롤 복구
  }

  // ✅ 각 poem-line 클릭 시 모달 열기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      openModal(line.textContent.trim());
    });
  });

  // ✅ 닫기 버튼
  closeBtn.addEventListener("click", closeModal);

  // ✅ 배경(오버레이) 클릭 시 닫기 (모달 박스 클릭은 제외)
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  // ✅ ESC로 닫기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) {
      closeModal();
    }
  });

  // ✅ 모달에 태그 추가
  function populateTags(lineId) {
    const tagContainer = document.querySelector(".tag_contatiner");
    tagContainer.innerHTML = ""; // 초기화

    const emotions = emotionDummyData[lineId];
    if (emotions) {
      for (const [annotator, tags] of Object.entries(emotions)) {
        const annotatorDiv = document.createElement("div");
        annotatorDiv.classList.add("annotator-tags");

        const annotatorTitle = document.createElement("h4");
        annotatorTitle.textContent = `${annotator}:`;
        annotatorDiv.appendChild(annotatorTitle);

        const tagList = document.createElement("div");
        tags.forEach(tag => {
          const tagItem = document.createElement("span");
          tagItem.classList.add("emotion-chip");  
          tagItem.id = tag;
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        annotatorDiv.appendChild(tagList);
        tagContainer.appendChild(annotatorDiv);
      }
    } else {
      tagContainer.textContent = "태그 정보가 없습니다.";
    }
  }

  // ✅ 모달 열 때 태그 채우기

    line.addEventListener("click", () => {
      populateTags(line.id);
    });
