<div class="poem-frame">
  <p class="poem-title">엄마야 누나야</p>

  <p class="poem-line" id="line_1">엄마야 누나야 강변 살자,</p>
  <p class="poem-line" id="line_2">뜰에는 반짝는 금모래빛,</p>
  <p class="poem-line" id="line_3">뒷문 밖에는 갈잎의 노래</p>
  <p class="poem-line" id="line_4">엄마야 누나야 강변 살자.</p>
</div>

<!-- ✅ MODAL -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <p id="modalTitle" class="modal-title">Line Detail</p>
      <button class="modal-close" id="modalCloseBtn" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <p id="modalLineText" class="clicked-line"></p>
      <div class = "tag_contatiner"></div>
      <p class="hint">배경을 클릭하거나 ESC를 누르면 닫힙니다.</p>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById("modalOverlay");
  const modalLineText = document.getElementById("modalLineText");
  const closeBtn = document.getElementById("modalCloseBtn");

  function openModal(text) {
    modalLineText.textContent = `"${text}"`;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden"; // 스크롤 잠금
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = ""; // 스크롤 복구
  }

  // ✅ 각 poem-line 클릭 시 모달 열기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      openModal(line.textContent.trim());
    });
  });

  // ✅ 닫기 버튼
  closeBtn.addEventListener("click", closeModal);

  // ✅ 배경(오버레이) 클릭 시 닫기 (모달 박스 클릭은 제외)
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  // ✅ ESC로 닫기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) {
      closeModal();
    }
  });

const emotionDummyData = {

line_1: {
  annotator_01: ["기대감", "환영/호의", "아껴주는", "없음"],
  annotator_02: ["기대감", "환영/호의", "아껴주는", "즐거움/신남"],
  annotator_03: ["기대감", "기쁨"],
  annotator_04: ["기대감", "아껴주는", "편안/쾌적", "행복"],
  annotator_05: ["기대감", "기쁨", "불평/불만", "편안/쾌적"]
},

line_2: {
  annotator_01: ["흐뭇함(귀여움/예쁨)", "신기함/관심", "없음"],
  annotator_02: ["흐뭇함(귀여움/예쁨)", "기쁨", "기대감", "아껴주는", "즐거움/신남", "편안/쾌적"],
  annotator_03: ["기대감", "기쁨", "신기함/관심"],
  annotator_04: ["감동/감탄", "기대감", "기쁨", "행복", "환영/호의"],
  annotator_05: ["기대감", "기쁨", "감동/감탄", "환영/호의", "흐뭇함(귀여움/예쁨)"]
},

line_3: {
  annotator_01: ["기대감", "신기함/관심", "흐뭇함(귀여움/예쁨)"],
  annotator_02: ["기쁨", "아껴주는", "편안/쾌적", "행복"],
  annotator_03: ["기쁨", "신기함/관심", "흐뭇함(귀여움/예쁨)"],
  annotator_04: ["행복", "편안/쾌적", "기쁨"],
  annotator_05: ["기대감", "기쁨", "흐뭇함(귀여움/예쁨)"]
},

line_4: {
  annotator_01: ["아껴주는", "기대감", "즐거움/신남"],
  annotator_02: ["기대감", "아껴주는", "즐거움/신남"],
  annotator_03: ["감동/감탄", "기대감", "기쁨"],
  annotator_04: ["기대감", "아껴주는", "행복", "즐거움/신남"],
  annotator_05: ["기쁨", "기대감", "아껴주는", "즐거움/신남", "행복"]
}

};

  // ✅ 모달에 태그 추가
  function populateTags(lineId) {
    const tagContainer = document.querySelector(".tag_contatiner");
    tagContainer.innerHTML = ""; // 초기화

    const emotions = emotionDummyData[lineId];
    if (emotions) {
      for (const [annotator, tags] of Object.entries(emotions)) {
        const annotatorDiv = document.createElement("div");
        annotatorDiv.classList.add("annotator-tags");

        const annotatorTitle = document.createElement("h4");
        annotatorTitle.textContent = `${annotator}:`;
        annotatorDiv.appendChild(annotatorTitle);

        const tagList = document.createElement("div");
        tags.forEach(tag => {
          const tagItem = document.createElement("span");
          tagItem.classList.add("emotion-chip");  
          tagItem.id = tag;
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        annotatorDiv.appendChild(tagList);
        tagContainer.appendChild(annotatorDiv);
      }
    } else {
      tagContainer.textContent = "태그 정보가 없습니다.";
    }
  }

  // ✅ 모달 열 때 태그 채우기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      populateTags(line.id);
    });
  });

</script>
