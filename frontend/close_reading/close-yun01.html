<h2>Close Reading</h2>
<h3>가까이 읽기</h3>
<div class="author-buttons">
    <a href="close-kim-menu.html"><button class="author-btn">김소월</button></a>
    <a href="close-yun-menu.html"><button class="author-btn active">윤동주</button></a>
    <a href="close-lee-menu.html"><button class="author-btn">이상</button></a>
    <a href="close-lim-menu.html"><button class="author-btn">임화</button></a>
    <a href="close-han-menu.html"><button class="author-btn">한용운</button></a>

<div class="poem-frame">
  <p class="poem-title">서시</p>

  <p class="poem-line" id="line_1">죽는 날까지 하늘을 우러러</p>
  <p class="poem-line" id="line_2">한 점 부끄럼이 없기를,</p>
  <p class="poem-line"id="line_3">잎새에 이는 바람에도</p>
  <p class="poem-line" id="line_4">나는 괴로워했다.</p>
  <p class="poem-line" id="line_5">별을 노래하는 마음으로</p>
  <p class="poem-line" id="line_6">모든 죽어가는 것을 사랑해야지</p>
  <p class="poem-line" id="line_7">그리고 나한테 주어진 길을</p>
  <p class="poem-line" id="line_8">걸어가야겠다.</p>
  <div class="poem-stanza"></div>
  <p class="poem-line" id="line_9">오늘 밤에도 별이 바람에 스치운다.</p>

</div>

<!-- ✅ MODAL -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <p id="modalTitle" class="modal-title">Line Detail</p>
      <button class="modal-close" id="modalCloseBtn" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <p id="modalLineText" class="clicked-line"></p>
      <div class = "tag_contatiner"></div>
      <p class="hint">배경을 클릭하거나 ESC를 누르면 닫힙니다.</p>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById("modalOverlay");
  const modalLineText = document.getElementById("modalLineText");
  const closeBtn = document.getElementById("modalCloseBtn");

  function openModal(text) {
    modalLineText.textContent = `"${text}"`;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden"; // 스크롤 잠금
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = ""; // 스크롤 복구
  }

  // ✅ 각 poem-line 클릭 시 모달 열기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      openModal(line.textContent.trim());
    });
  });

  // ✅ 닫기 버튼
  closeBtn.addEventListener("click", closeModal);

  // ✅ 배경(오버레이) 클릭 시 닫기 (모달 박스 클릭은 제외)
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  // ✅ ESC로 닫기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) {
      closeModal();
    }
  });

  const emotionDummyData = {
  line_1: {
    annotator_01: ["비장함"],
    annotator_02: ["비장함"],
    annotator_03: ["뿌듯함", "비장함"],
    annotator_04: ["비장함", "뿌듯함", "감동/감탄"],
    annotator_05: ["비장함", "서러움", "슬픔"]
  },
  line_2: {
    annotator_01: ["부끄러움", "비장함"],
    annotator_02: ["부끄러움", "비장함", "기대감", "불안/걱정", "서러움", "슬픔"],
    annotator_03: ["깨달음", "비장함", "뿌듯함"],
    annotator_04: ["비장함", "부끄러움", "기대감"],
    annotator_05: ["비장함"]
  },
  line_3: {
    annotator_01: ["기대감", "신기함/관심"],
    annotator_02: ["기대감", "불안/걱정", "비장함"],
    annotator_03: ["슬픔", "서러움", "불안/걱정", "당황/난처"],
    annotator_04: ["비장함", "슬픔"],
    annotator_05: ["감동/감탄", "신기함/관심", "편안/쾌적", "기대감"]
  },
  line_4: {
    annotator_01: ["절망", "슬픔", "패배/자기혐오"],
    annotator_02: ["절망", "슬픔", "패배/자기혐오", "죄책감", "힘듦/지침", "비장함"],
    annotator_03: ["당황/난처", "서러움", "죄책감", "패배/자기혐오"],
    annotator_04: ["비장함", "슬픔", "패배/자기혐오", "절망", "힘듦/지침"],
    annotator_05: ["슬픔", "서러움", "절망", "힘듦/지침", "패배/자기혐오"]
  },
  line_5: {
    annotator_01: ["기쁨", "신기함/관심", "즐거움/신남", "흐뭇함(귀여움/예쁨)", "뿌듯함"],
    annotator_02: ["기쁨", "뿌듯함", "감동/감탄", "슬픔", "비장함", "아껴주는", "환영/호의", "기대감"],
    annotator_03: ["고마움", "기대감", "기쁨", "아껴주는", "흐뭇함(귀여움/예쁨)"],
    annotator_04: ["감동/감탄", "기대감", "기쁨", "아껴주는", "행복"],
    annotator_05: ["즐거움/신남", "기대감", "기쁨", "행복"]
  },
  line_6: {
    annotator_01: ["비장함", "불쌍함/연민", "아껴주는", "기쁨"],
    annotator_02: ["비장함", "불쌍함/연민", "아껴주는", "슬픔", "환영/호의", "기대감", "안심/신뢰"],
    annotator_03: ["불쌍함/연민", "비장함", "아껴주는", "존경"],
    annotator_04: ["비장함", "슬픔"],
    annotator_05: ["불쌍함/연민", "비장함"]
  },
  line_7: {
    annotator_01: ["없음"],
    annotator_02: ["없음"],
    annotator_03: ["부담/안_내킴", "신기함/관심", "힘듦/지침"],
    annotator_04: ["비장함", "기쁨"],
    annotator_05: ["비장함", "깨달음"]
  },
  line_8: {
    annotator_01: ["비장함", "깨달음"],
    annotator_02: ["비장함", "깨달음"],
    annotator_03: ["없음"],
    annotator_04: ["기대감", "비장함"],
    annotator_05: ["기대감", "비장함"]
  },
  line_9: {
    annotator_01: ["흐뭇함(귀여움/예쁨)", "기대감", "편안/쾌적"],
    annotator_02: ["감동/감탄", "서러움", "슬픔", "아껴주는", "흐뭇함(귀여움/예쁨)"],
    annotator_03: ["슬픔", "서러움", "불안/걱정"],
    annotator_04: ["감동/감탄", "기대감", "기쁨", "신기함/관심", "아껴주는"],
    annotator_05: ["감동/감탄", "기대감", "깨달음", "놀람", "신기함/관심"]
  },
};
  // ✅ 모달에 태그 추가
  function populateTags(lineId) {
    const tagContainer = document.querySelector(".tag_contatiner");
    tagContainer.innerHTML = ""; // 초기화

    const emotions = emotionDummyData[lineId];
    if (emotions) {
      for (const [annotator, tags] of Object.entries(emotions)) {
        const annotatorDiv = document.createElement("div");
        annotatorDiv.classList.add("annotator-tags");

        const annotatorTitle = document.createElement("h4");
        annotatorTitle.textContent = `${annotator}:`;
        annotatorDiv.appendChild(annotatorTitle);

        const tagList = document.createElement("div");
        tags.forEach(tag => {
          const tagItem = document.createElement("span");
          tagItem.classList.add("emotion-chip");  
          tagItem.id = tag;
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        annotatorDiv.appendChild(tagList);
        tagContainer.appendChild(annotatorDiv);
      }
    } else {
      tagContainer.textContent = "태그 정보가 없습니다.";
    }
  }

  // ✅ 모달 열 때 태그 채우기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      populateTags(line.id);
    });
  });

</script>

</body>
