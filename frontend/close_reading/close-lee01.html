<h2>Close Reading</h2>
<h3>가까이 읽기</h3>
<div class="author-buttons">
    <a href="close-kim-menu.html"><button class="author-btn">김소월</button></a>
    <a href="close-yun-menu.html"><button class="author-btn">윤동주</button></a>

<div class="poem-frame">
  <p class="poem-title">꽃나무</p>
  <span class="poem-line" id="line_1">벌판한복판에 꽃나무하나가있소.</span>
  <span class="poem-line" id="line_2">근처(近處)에는꽃나무가하나도없소.</span>
  <span class="poem-line" id="line_3">꽃나무는제가생각하는꽃나무를 열심(熱心)으로생각하는것처럼 열심으로꽃을피워가지고섰소.</span>
  <span class="poem-line" id="line_4">꽃나무는제가생각하는꽃나무에게갈수없소.</span>
  <span class="poem-line" id="line_5">나는막달아났소.</span>
  <span class="poem-line" id="line_6">한꽃나무를위(爲)하여 그러는것처럼 나는참그런이상스러운흉내를내었소.</span>
</div>

<!-- ✅ MODAL -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <p id="modalTitle" class="modal-title">Line Detail</p>
      <button class="modal-close" id="modalCloseBtn" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <p id="modalLineText" class="clicked-line"></p>
      <div class = "tag_contatiner"></div>
      <p class="hint">배경을 클릭하거나 ESC를 누르면 닫힙니다.</p>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById("modalOverlay");
  const modalLineText = document.getElementById("modalLineText");
  const closeBtn = document.getElementById("modalCloseBtn");

  function openModal(text) {
    modalLineText.textContent = `"${text}"`;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden"; // 스크롤 잠금
  }

  function closeModal() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = ""; // 스크롤 복구
  }

  // ✅ 각 poem-line 클릭 시 모달 열기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      openModal(line.textContent.trim());
    });
  });

  // ✅ 닫기 버튼
  closeBtn.addEventListener("click", closeModal);

  // ✅ 배경(오버레이) 클릭 시 닫기 (모달 박스 클릭은 제외)
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  // ✅ ESC로 닫기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) {
      closeModal();
    }
  });

  const emotionDummyData = {
  line_1: {
    annotator_01: ["신기함/관심", "없음"],
    annotator_02: ["신기함/관심", "기대감", "불안/걱정", "흐뭇함(귀여움/예쁨)", "환영/호의", "서러움"],
    annotator_03: ["기대감", "기쁨", "신기함/관심"],
    annotator_04: ["기대감", "신기함/관심", "아껴주는"],
    annotator_05: ["기대감", "신기함/관심", "존경", "감동/감탄"]
  },
  line_2: {
    annotator_01: ["불안/걱정", "안타까움/실망", "슬픔", "서러움"],
    annotator_02: ["당황/난처", "불안/걱정", "불평/불만", "공포/무서움", "서러움", "슬픔", "안타까움/실망", "불쌍함/연민"],
    annotator_03: ["당황/난처", "놀람", "불안/걱정", "안타까움/실망"],
    annotator_04: ["불안/걱정", "슬픔", "안타까움/실망", "힘듦/지침"],
    annotator_05: ["슬픔", "놀람", "당황/난처", "힘듦/지침"]
  },
  line_3: {
    annotator_01: ["고마움", "깨달음", "신기함/관심", "아껴주는", "환영/호의"],
    annotator_02: ["흐뭇함(귀여움/예쁨)", "고마움", "감동/감탄", "아껴주는", "불쌍함/연민", "슬픔", "환영/호의"],
    annotator_03: ["비장함", "뿌듯함"],
    annotator_04: ["감동/감탄", "기쁨", "아껴주는", "신기함/관심", "행복"],
    annotator_05: ["감동/감탄", "존경", "고마움"]
  },
  line_4: {
    annotator_01: ["불안/걱정", "서러움", "깨달음", "부담/안내킴", "당황/난처", "슬픔"],
    annotator_02: ["깨달음", "불쌍함/연민", "안타까움/실망", "불평/불만", "불안/걱정", "서러움", "슬픔", "절망", "당황/난처"],
    annotator_03: ["당황/난처", "부담/안내킴", "불쌍함/연민", "서러움", "슬픔", "안타까움/실망"],
    annotator_04: ["당황/난처", "불안/걱정", "부담/안내킴", "슬픔", "안타까움/실망", "절망", "힘듦/지침"],
    annotator_05: ["당황/난처", "놀람", "슬픔", "서러움", "안타까움/실망"]
  },
  line_5: {
    annotator_01: ["공포/무서움", "죄책감", "당황/난처", "의심/불신"],
    annotator_02: ["공포/무서움", "당황/난처", "부끄러움", "부담/안내킴", "패배/자기혐오", "한심함"],
    annotator_03: ["공포/무서움", "당황/난처", "부담/안내킴"],
    annotator_04: ["당황/난처", "경악", "힘듦/지침", "슬픔"],
    annotator_05: ["공포/무서움", "죄책감", "한심함"]
  },
  line_6: {
    annotator_01: ["죄책감", "패배/자기혐오", "아껴주는", "기대감", "당황/난처", "신기함/관심"],
    annotator_02: ["아껴주는", "패배/자기혐오", "서러움", "슬픔", "절망", "한심함", "불쌍함/연민", "불안/걱정", "안타까움/실망"],
    annotator_03: ["한심함", "재미없음"],
    annotator_04: ["당황/난처", "놀람", "부끄러움"],
    annotator_05: ["패배/자기혐오", "힘듦/지침", "비장함", "안타까움/실망"]
  }
};
  // ✅ 모달에 태그 추가
  function populateTags(lineId) {
    const tagContainer = document.querySelector(".tag_contatiner");
    tagContainer.innerHTML = ""; // 초기화

    const emotions = emotionDummyData[lineId];
    if (emotions) {
      for (const [annotator, tags] of Object.entries(emotions)) {
        const annotatorDiv = document.createElement("div");
        annotatorDiv.classList.add("annotator-tags");

        const annotatorTitle = document.createElement("h4");
        annotatorTitle.textContent = `${annotator}:`;
        annotatorDiv.appendChild(annotatorTitle);

        const tagList = document.createElement("div");
        tags.forEach(tag => {
          const tagItem = document.createElement("span");
          tagItem.classList.add("emotion-chip");  
          tagItem.id = tag;
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        annotatorDiv.appendChild(tagList);
        tagContainer.appendChild(annotatorDiv);
      }
    } else {
      tagContainer.textContent = "태그 정보가 없습니다.";
    }
  }

  // ✅ 모달 열 때 태그 채우기
  document.querySelectorAll(".poem-line").forEach(line => {
    line.addEventListener("click", () => {
      populateTags(line.id);
    });
  });

</script>

</body>
