<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Co-Reading Web Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/co_style.css" />
</head>
<body>

  <header>
  <div class="logo"><a href="../index.html">KPoEM</a></div>
  <nav>
    <!-- <a href="#" class="active">About</a> -->
    <a href="../close_reading/close-kim-menu.html">Close Reading</a>
    <a href="../distant_reading/distant-kim.html">Distant Reading</a>
    <a href="co.html">Co-Reading</a>
  </nav>
</header>
<div class="window-container">
<div>
<h2>Co-Reading</h2>
<h3>함께 읽기</h3>
</div>
    <div class="window-body">
      <label for="poemSelect">시 선택</label>
<select id="poemSelect" class="select-box">
  <option value="">선택해 주세요</option>
  <option value="김소월01">김소월 - 진달래꽃</option>
  <option value="윤동주01">윤동주 - 서시</option>
  <option value="이상01">이상 - 꽃나무</option>
  <option value="임화01">임화 - 현해탄 (일부 발췌) </option>
  <option value="한용운01">한용운 - 나룻배와 행인</option>
  <option value="신석정01">신석정 - 네 눈망울에서는</option>
  <option value="백석01">백석 - 나와 나타샤와 흰 당나귀 (일부 발췌)</option>
  <option value="김수영01">김수영 - 푸른 하늘을</option>
</select>

<label for="userText">시 전문</label>
<textarea id="userText" readonly placeholder="시를 선택하면 전문이 표시됩니다."></textarea>
        <div class="button-row">
  <button id="analyzeButton">함께 읽기</button>
  <button id="analyzeResetButton">지우기</button>
</div>
      <div class="revealing-row">
        <span class="revealing-value" id="revealingValue">-</span>

        <!-- 분석중 모션 -->
        <span class="analyzing" id="analyzing">
          Reading
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </div>

      <div class="gradient-box" id="gradientBox">
        <div class="gradient-fill" id="gradientFill"></div>
      </div>


      <div class="legend">
        <div class="legend-item">
          <div class="swatch" id="swatch1"></div>
          <div class="legend-text" id="legend1"></div>
        </div>
        <div class="legend-item">
          <div class="swatch" id="swatch2"></div>
          <div class="legend-text" id="legend2"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  <script src="../js/app.js"></script>
